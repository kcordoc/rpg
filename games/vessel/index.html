<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c0305" />
    <link rel="icon" href="data:," />
    <title>The 50% Lie — Artery Defense</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Playable artery defense game canvas"></canvas>

      <section id="hud" aria-live="polite">
        <div class="hud-left">
          <div class="stat stat-wall">
            <span class="ic">♥</span>
            <div class="meter"><div class="meter-fill" id="wall-fill"></div></div>
            <strong id="wall-text">100</strong>
          </div>
          <div class="stat stat-plaque">
            <span class="ic">⬡</span>
            <div class="meter"><div class="meter-fill plaque" id="plaque-fill"></div></div>
            <strong id="plaque-text">0%</strong>
          </div>
          <div class="stat stat-level">
            <span class="ic lvl" id="level-text">Lv 1</span>
            <div class="meter slim"><div class="meter-fill xp" id="xp-fill"></div></div>
          </div>
        </div>
        <div class="hud-right">
          <div class="pill">
            <strong id="wave-text">Wave 1/3</strong>
            <span id="timer-text">42s</span>
          </div>
          <div class="score">
            <span>SCORE</span>
            <strong id="score-text">0</strong>
          </div>
          <button id="mute-btn" type="button" aria-label="Toggle sound">♪</button>
        </div>
      </section>

      <div id="boss-bar" hidden>
        <span id="boss-label">THROMBUS</span>
        <div class="boss-track"><div class="boss-fill" id="boss-fill"></div></div>
      </div>

      <div id="combo" hidden></div>
      <div id="fps"></div>
      <div id="run-header"></div>
      <div id="toast"></div>
      <div id="overlay"></div>

      <div id="touch-controls" aria-hidden="true">
        <div id="touch-stick"><div id="touch-knob"></div></div>
      </div>
      <button id="dash-button" type="button" hidden></button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
