<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a0608" />
    <link rel="icon" href="data:," />
    <title>The 50% Lie — Artery Defense</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Playable artery defense game canvas"></canvas>

      <section id="hud" aria-live="polite">
        <div class="bar" id="bar-wall">
          <span class="bar-label">Wall</span>
          <div class="bar-track"><div class="bar-fill" id="bar-wall-fill"></div></div>
          <strong id="bar-wall-text">100</strong>
        </div>
        <div class="bar" id="bar-plaque">
          <span class="bar-label">Narrowed</span>
          <div class="bar-track"><div class="bar-fill plaque" id="bar-plaque-fill"></div></div>
          <strong id="bar-plaque-text">0%</strong>
        </div>
        <div class="bar" id="bar-level">
          <span class="bar-label" id="bar-level-text">Lv 1</span>
          <div class="bar-track"><div class="bar-fill xp" id="bar-xp-fill"></div></div>
        </div>
        <div class="pill">
          <strong id="bar-wave-text">Wave 1/3</strong>
          <span id="bar-timer-text">42s</span>
        </div>
      </section>

      <div id="run-header"></div>
      <div id="toast"></div>
      <div id="overlay"></div>

      <div id="touch-controls" aria-hidden="true">
        <div id="touch-stick">
          <div id="touch-knob"></div>
        </div>
      </div>
      <button id="dash-button" type="button" hidden></button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
